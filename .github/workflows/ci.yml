name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest --cov=openscope --cov-report=term-missing

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e "..[api]"
      - run: npm ci
      - name: API types are up to date with the backend
        run: npm run gen:api && git diff --exit-code -- openapi.json src/app/api/schema.d.ts
      - run: npx prettier --check "src/**/*.{ts,css}"
      - run: npx ng test --watch=false
      - run: npx ng build

  docker:
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t openscope:ci .
      - name: Smoke test the image (default settings)
        run: |
          docker run -d --name os -p 8000:8000 openscope:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 1; done
          curl -sf localhost:8000/ | grep -q "<app-root"
          curl -sf -X POST localhost:8000/api/demo | grep -q inventory_id
          curl -sf localhost:8000/api/inventories | grep -q "DESNZ"
          docker logs os
      - name: Smoke test the image as deployed on Render (custom $PORT, public demo)
        run: |
          docker run -d --name demo -p 9000:10000 -e PORT=10000 -e OPENSCOPE_PUBLIC_DEMO=1 \
            -e OPENSCOPE_DB_URL=sqlite:////tmp/openscope.db openscope:ci
          for i in $(seq 1 30); do curl -sf localhost:9000/api/health && break; sleep 1; done
          curl -sf localhost:9000/api/meta | grep -q '"public_demo":true'
          curl -sf localhost:9000/api/inventories | grep -q "DESNZ"
          docker logs demo
