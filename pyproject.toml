[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "openscope"
version = "0.12.0"
description = "Open-source carbon accounting engine: GHG Protocol Scope 1, 2 and 3 calculations with transparent, auditable emission factors."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Sabawoon Daqiq" }]
keywords = ["carbon accounting", "ghg protocol", "scope 3", "esg", "emissions", "sustainability", "csrd", "issb"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
importers = ["openpyxl>=3.1"]
ai = ["anthropic>=2.14"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "openpyxl>=3.1", "anthropic>=2.14", "fastapi>=0.115", "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0", "python-multipart>=0.0.9", "httpx>=0.27"]

[project.scripts]
openscope = "openscope.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openscope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*"]
ignore_missing_imports = true
